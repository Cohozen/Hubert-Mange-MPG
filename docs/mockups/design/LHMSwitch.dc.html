<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ off }}" hint-placeholder-val="{{ true }}">
  <div style="width:52px; height:30px; border-radius:999px; background:#0A0E27; border:1px solid #2A3160; display:flex; align-items:center; justify-content:flex-start; padding:3px; box-sizing:border-box;">
    <div style="width:22px; height:22px; border-radius:50%; background:#8B92C4;"></div>
  </div>
</sc-if>
<sc-if value="{{ on }}" hint-placeholder-val="{{ false }}">
  <div style="width:52px; height:30px; border-radius:999px; background:linear-gradient(90deg,#FF2D78,#FF6B35); display:flex; align-items:center; justify-content:flex-end; padding:3px; box-sizing:border-box; box-shadow:0 3px 10px rgba(255,45,120,.4);">
    <div style="width:22px; height:22px; border-radius:50%; background:#fff;"></div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:52,&quot;height&quot;:30},&quot;on&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const on = !!this.props.on;
    return { on, off: !on };
  }
}
</script>
</body>
</html>
